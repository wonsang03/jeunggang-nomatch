name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # prisma client 가 없으면 config.ts import 가 깨져 타입체크가 실패한다
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      # 취약점은 보이게만 한다. 지금 남은 건 devDependency·CLI 경로뿐이라
      # 여기서 막으면 무관한 PR 이 계속 빨갛게 된다.
      - name: npm audit (비차단)
        run: npm audit --audit-level=high
        continue-on-error: true

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: npm audit (비차단)
        run: npm audit --audit-level=high
        continue-on-error: true
