# Railway Settings → Root Directory = server 일 때 (권장)

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate && npx tsc"

[deploy]
startCommand = "sh -c 'export DATABASE_URL=\"${DATABASE_URL:-file:./data.db}\"; npx prisma db push && node dist/index.js'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
