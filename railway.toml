# Root Directory 비울 때

[build]
builder = "NIXPACKS"
buildCommand = "cd web && npm install && npm run build && cd ../server && npm install && npx prisma generate && npx tsc && rm -rf public && mkdir -p public && cp -r ../web/dist/. public/"

[deploy]
startCommand = "sh -c 'cd server && export DATABASE_URL=\"${DATABASE_URL:-file:./data.db}\"; npx prisma db push && node dist/index.js'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
