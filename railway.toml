[build]
builder = "NIXPACKS"
buildCommand = "cd server && npm install && npx prisma generate && npx tsc"

[deploy]
startCommand = "sh -c 'cd server && export DATABASE_URL=\"${DATABASE_URL:-file:./data.db}\"; npx prisma db push && node dist/index.js'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
