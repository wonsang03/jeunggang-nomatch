# Root Directory 를 비운 채 배포할 때 사용
# 권장: Railway Settings → Root Directory = server (이 파일은 무시되고 server/railway.toml 사용)

[build]
builder = "NIXPACKS"
buildCommand = "cd server && npm install && npx prisma generate && npx tsc"

[deploy]
startCommand = "cd server && npx prisma db push && node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
